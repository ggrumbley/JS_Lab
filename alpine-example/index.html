<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alpine Example</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  </head>
  <body>
    <h1>ALPINE.JS</h1>
    <div
      x-data="{
        name: 'Raymond',
        age: 51,
        cool: true,
        hobbies:['building cat demos','star wars','cats']
      }"
    >
      <p>My name is <span x-text="name"></span>. i'm <span x-text="age"></span> years old.</p>
      <p x-show="cool">Oh, and I'm so darn cool!</p>
      <template x-if="cool">
        <p>Did I mention I'm cool?</p>
      </template>
      <ul>
        <template x-for="hobby in hobbies">
          <li x-text="hobby"></li>
        </template>
      </ul>
    </div>
  </body>
</html>
